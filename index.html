<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odia Story Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
        }
        
        /* The specific font for the preview area */
        .odia-font {
            font-family: 'Noto Sans Oriya', sans-serif;
        }

        /* Aspect Ratio 9:16 Container */
        .phone-preview-container {
            width: 100%;
            max-width: 360px; /* Base width for preview */
            aspect-ratio: 9/16;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #333;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* The actual canvas content */
        #render-target {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Floating Text Box */
        #text-box {
            position: absolute;
            left: 50%;
            transform: translateX(-50%); /* Center horizontally */
            width: 85%;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: move; /* Indicates draggable */
            user-select: none; /* Prevent text selection while dragging */
            top: 20%; /* Default top position */
        }

        /* Custom Scrollbar for inputs */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        textarea::-webkit-scrollbar-thumb {
            background: #888; 
            border-radius: 4px;
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Range input styling improvements */
        input[type=range] {
            accent-color: #2563eb; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- Controls Panel -->
    <div class="w-full md:w-1/2 lg:w-2/5 p-6 bg-white overflow-y-auto h-screen shadow-xl z-10 flex flex-col gap-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Odia Story Maker</h1>
            <p class="text-gray-500 text-sm">Create stunning 9:16 status images.</p>
        </div>

        <!-- Image Upload -->
        <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">1. Background Image</label>
            <input type="file" id="bg-upload" accept="image/*" 
                class="block w-full text-sm text-gray-500
                file:mr-4 file:py-2 file:px-4
                file:rounded-full file:border-0
                file:text-sm file:font-semibold
                file:bg-blue-50 file:text-blue-700
                hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-lg p-1"
            >
        </div>

        <!-- Text Inputs -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">2. Header Text (Odia)</label>
                <input type="text" id="input-header" placeholder="Enter Header..." class="odia-font w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" value="ଜୀବନରେ ସଫଳ ହେବାକୁ ହେଲେ ୫ଟି ଟି ବାକ୍ୟ ମନେ ରଖ">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">3. Body Text (Odia)</label>
                <textarea id="input-body" rows="6" placeholder="Enter body text..." class="odia-font w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
☘️ ମୋ ପାଖରେ ସମୟ ନାହିଁ 
☘️ ମୋ ଦ୍ୱାରା ହେବ ନାହିଁ
☘️ ମୋର ମୁଡ଼ ନାହିଁ 
☘️ ମୋ ଭାଗ୍ୟ ଖରାପ
☘️ ଲୋକ କଣ କହିବେ?</textarea>
            </div>
        </div>

        <!-- Styling Controls -->
        <div class="space-y-6 border-t pt-4">
            
            <!-- Header Styling Group -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h3 class="font-semibold text-gray-700 mb-3 text-sm uppercase tracking-wide">Header Styling</h3>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Size</label>
                        <input type="range" id="size-header" min="16" max="60" value="28" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Line Spacing</label>
                        <input type="range" id="line-height-header" min="0.8" max="2.0" step="0.1" value="1.2" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Color</label>
                        <div class="flex gap-2">
                            <button onclick="setHeaderColor('#1e40af')" class="w-6 h-6 rounded-full bg-blue-800 border ring-1 ring-offset-1 ring-transparent hover:ring-blue-400"></button>
                            <button onclick="setHeaderColor('#dc2626')" class="w-6 h-6 rounded-full bg-red-600 border ring-1 ring-offset-1 ring-transparent hover:ring-red-400"></button>
                            <button onclick="setHeaderColor('#000000')" class="w-6 h-6 rounded-full bg-black border ring-1 ring-offset-1 ring-transparent hover:ring-gray-400"></button>
                            <input type="color" id="color-header-picker" class="w-6 h-6 p-0 border-0 rounded-full overflow-hidden cursor-pointer" value="#1e40af">
                        </div>
                    </div>
                    <div>
                         <label class="block text-xs font-medium text-gray-600 mb-1">Alignment</label>
                         <div class="flex rounded-md shadow-sm" role="group">
                            <button type="button" onclick="setHeaderAlign('left')" class="px-2 py-1 text-xs font-medium text-gray-900 bg-white border border-gray-200 rounded-l-lg hover:bg-gray-100 focus:z-10 focus:ring-2 focus:ring-blue-700 focus:text-blue-700">L</button>
                            <button type="button" onclick="setHeaderAlign('center')" class="px-2 py-1 text-xs font-medium text-gray-900 bg-white border-t border-b border-gray-200 hover:bg-gray-100 focus:z-10 focus:ring-2 focus:ring-blue-700 focus:text-blue-700">C</button>
                            <button type="button" onclick="setHeaderAlign('right')" class="px-2 py-1 text-xs font-medium text-gray-900 bg-white border border-gray-200 rounded-r-lg hover:bg-gray-100 focus:z-10 focus:ring-2 focus:ring-blue-700 focus:text-blue-700">R</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Body Styling Group -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h3 class="font-semibold text-gray-700 mb-3 text-sm uppercase tracking-wide">Body Styling</h3>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Size</label>
                        <input type="range" id="size-body" min="10" max="40" value="16" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                         <label class="block text-xs font-medium text-gray-600 mb-1">Line Spacing</label>
                         <input type="range" id="line-height-body" min="1.0" max="3.0" step="0.1" value="1.6" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                     <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Color</label>
                        <div class="flex gap-2">
                            <button onclick="setBodyColor('#000000')" class="w-6 h-6 rounded-full bg-black border ring-1 ring-offset-1 ring-transparent hover:ring-gray-400"></button>
                            <button onclick="setBodyColor('#374151')" class="w-6 h-6 rounded-full bg-gray-700 border ring-1 ring-offset-1 ring-transparent hover:ring-gray-400"></button>
                            <button onclick="setBodyColor('#1e3a8a')" class="w-6 h-6 rounded-full bg-blue-900 border ring-1 ring-offset-1 ring-transparent hover:ring-blue-400"></button>
                            <input type="color" id="color-body-picker" class="w-6 h-6 p-0 border-0 rounded-full overflow-hidden cursor-pointer" value="#000000">
                        </div>
                    </div>
                    <div>
                         <label class="block text-xs font-medium text-gray-600 mb-1">Alignment</label>
                         <div class="flex rounded-md shadow-sm" role="group">
                            <button type="button" onclick="setBodyAlign('left')" class="px-2 py-1 text-xs font-medium text-gray-900 bg-white border border-gray-200 rounded-l-lg hover:bg-gray-100 focus:z-10 focus:ring-2 focus:ring-blue-700 focus:text-blue-700">L</button>
                            <button type="button" onclick="setBodyAlign('center')" class="px-2 py-1 text-xs font-medium text-gray-900 bg-white border-t border-b border-gray-200 hover:bg-gray-100 focus:z-10 focus:ring-2 focus:ring-blue-700 focus:text-blue-700">C</button>
                            <button type="button" onclick="setBodyAlign('right')" class="px-2 py-1 text-xs font-medium text-gray-900 bg-white border border-gray-200 rounded-r-lg hover:bg-gray-100 focus:z-10 focus:ring-2 focus:ring-blue-700 focus:text-blue-700">R</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Position Slider (Alternative to drag) -->
            <div>
                 <label class="block text-xs font-medium text-gray-600 mb-1">Vertical Position (Or drag the box)</label>
                 <input type="range" id="pos-y" min="0" max="80" value="20" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>

        </div>

        <button id="download-btn" class="mt-auto w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200 flex justify-center items-center gap-2">
            <span>Download HD Image</span>
            <div class="loader" id="loader"></div>
        </button>
    </div>

    <!-- Preview Panel -->
    <div class="w-full md:w-1/2 lg:w-3/5 bg-gray-100 flex items-center justify-center p-8 overflow-hidden h-screen">
        
        <div class="phone-preview-container">
            <div id="render-target" style="background-image: url('https://placehold.co/1080x1920/222/FFF?text=Upload+Image');">
                <!-- Draggable Text Box -->
                <div id="text-box">
                    <h2 id="preview-header" class="odia-font font-bold mb-4 leading-tight text-center" style="color: #1e40af; font-size: 28px; line-height: 1.2;">
                        ଜୀବନରେ ସଫଳ ହେବାକୁ ହେଲେ ୫ଟି ଟି ବାକ୍ୟ ମନେ ରଖ
                    </h2>
                    <div id="preview-body" class="odia-font font-bold" style="color: #000000; font-size: 16px; line-height: 1.6; text-align: left;">
                        ☘️ ମୋ ପାଖରେ ସମୟ ନାହିଁ 
                        ☘️ ମୋ ଦ୍ୱାରା ହେବ ନାହିଁ
                        ☘️ ମୋର ମୁଡ଼ ନାହିଁ
                        ☘️ ମୋ ଭାଗ୍ୟ ଖରାପ 
                        ☘️ ଲୋକ କଣ କହିବେ?
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // DOM Elements
        const bgUpload = document.getElementById('bg-upload');
        const renderTarget = document.getElementById('render-target');
        const textBox = document.getElementById('text-box');
        
        const inputHeader = document.getElementById('input-header');
        const inputBody = document.getElementById('input-body');
        const previewHeader = document.getElementById('preview-header');
        const previewBody = document.getElementById('preview-body');
        
        // Header Controls
        const sizeHeader = document.getElementById('size-header');
        const lineHeightHeader = document.getElementById('line-height-header');
        const colorHeaderPicker = document.getElementById('color-header-picker');
        
        // Body Controls
        const sizeBody = document.getElementById('size-body');
        const lineHeightBody = document.getElementById('line-height-body');
        const colorBodyPicker = document.getElementById('color-body-picker');
        
        const posY = document.getElementById('pos-y');
        const downloadBtn = document.getElementById('download-btn');
        const loader = document.getElementById('loader');

        // State
        let isDragging = false;
        let startY;
        let startTop;

        // 1. Handle Text Updates
        inputHeader.addEventListener('input', (e) => {
            previewHeader.innerText = e.target.value;
        });

        inputBody.addEventListener('input', (e) => {
            // Replace newlines with <br> for HTML rendering
            previewBody.innerHTML = e.target.value.replace(/\n/g, '<br>');
        });

        // 2. Handle Image Upload
        bgUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    renderTarget.style.backgroundImage = `url(${event.target.result})`;
                }
                reader.readAsDataURL(file);
            }
        });

        // 3. Handle Styling (Size & Line Height)
        sizeHeader.addEventListener('input', (e) => {
            previewHeader.style.fontSize = `${e.target.value}px`;
        });
        
        lineHeightHeader.addEventListener('input', (e) => {
            previewHeader.style.lineHeight = e.target.value;
        });

        sizeBody.addEventListener('input', (e) => {
            previewBody.style.fontSize = `${e.target.value}px`;
        });
        
        lineHeightBody.addEventListener('input', (e) => {
            previewBody.style.lineHeight = e.target.value;
        });

        // 4. Handle Position Slider
        posY.addEventListener('input', (e) => {
            textBox.style.top = `${e.target.value}%`;
        });

        // 5. Handle Colors & Alignment
        function setHeaderColor(color) {
            previewHeader.style.color = color;
            colorHeaderPicker.value = color;
        }
        
        function setBodyColor(color) {
            previewBody.style.color = color;
            colorBodyPicker.value = color;
        }
        
        function setHeaderAlign(align) {
            previewHeader.style.textAlign = align;
        }

        function setBodyAlign(align) {
            previewBody.style.textAlign = align;
        }

        colorHeaderPicker.addEventListener('input', (e) => {
            previewHeader.style.color = e.target.value;
        });

        colorBodyPicker.addEventListener('input', (e) => {
            previewBody.style.color = e.target.value;
        });

        // 6. Drag and Drop Logic for Text Box
        textBox.addEventListener('mousedown', startDrag);
        textBox.addEventListener('touchstart', startDrag, {passive: false});

        function startDrag(e) {
            isDragging = true;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            startY = clientY;
            startTop = parseInt(window.getComputedStyle(textBox).top);
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault(); // Prevent scrolling on touch
            
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const deltaY = clientY - startY;
            
            // Calculate new top as percentage to remain responsive
            const parentHeight = renderTarget.offsetHeight;
            let newTopPx = startTop + deltaY;
            let newTopPercent = (newTopPx / parentHeight) * 100;

            // Constraints (keep inside box somewhat)
            if (newTopPercent < 0) newTopPercent = 0;
            if (newTopPercent > 80) newTopPercent = 80;

            textBox.style.top = `${newTopPercent}%`;
            posY.value = newTopPercent; // Sync slider
        }

        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchend', stopDrag);
        }

        // 7. Download Function
        downloadBtn.addEventListener('click', () => {
            // Show loader
            const btnText = downloadBtn.querySelector('span');
            btnText.textContent = "Generating...";
            loader.style.display = "block";

            // We need to capture the #render-target
            // We scale it up to create an HD image (1080px width)
            // The preview container is roughly 360px wide. 
            // So we need a scale factor of 3 (360 * 3 = 1080).
            const element = document.getElementById('render-target');
            
            // Calculate scale based on actual current width of preview
            const currentWidth = element.offsetWidth;
            const targetWidth = 1080; 
            const scaleFactor = targetWidth / currentWidth;

            html2canvas(element, {
                scale: scaleFactor,
                useCORS: true, // Important if using cross-origin images (though we use file reader mostly)
                backgroundColor: null, // Transparent bg if image fails
                logging: false
            }).then(canvas => {
                // Create link and download
                const link = document.createElement('a');
                link.download = `odia-story-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // Reset button
                btnText.textContent = "Download HD Image";
                loader.style.display = "none";
            }).catch(err => {
                console.error(err);
                alert("Error generating image. Please try again.");
                btnText.textContent = "Download HD Image";
                loader.style.display = "none";
            });
        });
    </script>
</body>
</html>
